# Ricing Town compatibility fragment for Hyprland 0.54 and older
monitor = eDP-1, preferred, 0x0, 1
monitor = DP-1, 2560x1440@144, 1920x0, 1
general { gaps_in = 7; gaps_out = 14; border_size = 2; col.active_border = rgb(cba6f7); col.inactive_border = rgb(24243a); layout = dwindle }
decoration { rounding = 18; active_opacity = 0.98; inactive_opacity = 0.9; blur { enabled = true; size = 12; passes = 3 }; shadow { enabled = true; range = 24; color = rgb(000000) } }
input { kb_layout = us; follow_mouse = 1; touchpad { natural_scroll = false } }
animations { enabled = true; animation = global, 1, 6, default, slide }
bind = SUPER, RETURN, exec, kitty
bind = SUPER, B, exec, firefox
bind = SUPER, S, exec, pavucontrol
bind = SUPER, L, exec, hyprlock
windowrulev2 = float, center, class:^(pavucontrol)$
windowrulev2 = workspace 2, class:^(firefox)$
workspace = 1, monitor:eDP-1, persistent:true
workspace = 2, monitor:DP-1, persistent:true
exec-once = sh ~/.config/ricing-town/config/hybrid/start.sh
