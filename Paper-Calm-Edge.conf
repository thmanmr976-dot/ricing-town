# Ricing Town compatibility fragment for Hyprland 0.54 and older
monitor = , preferred, auto, 1
general { gaps_in = 12; gaps_out = 22; border_size = 1; col.active_border = rgb(8b5e3c); col.inactive_border = rgb(c8bfae); layout = dwindle }
decoration { rounding = 8; active_opacity = 1; inactive_opacity = 0.97; blur { enabled = false; size = 8; passes = 2 }; shadow { enabled = true; range = 8; color = rgb(000000) } }
input { kb_layout = us; follow_mouse = 1; touchpad { natural_scroll = false } }
animations { enabled = true; animation = global, 1, 5, default, fade }

exec-once = sh ~/.config/ricing-town/config/quickshell/start.sh
